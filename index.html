<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070f" />
    <meta name="description" content="Create and run eFootball tournaments: league, knockout, World Cup and Champions League formats with live tables and brackets." />
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&family=Baloo+Da+2:wght@600;700;800&family=Outfit:wght@400;500;600;700&family=Oxanium:wght@600;700&display=swap" rel="stylesheet" />
    <title>eFootball Tournament</title>
    <script>
      // apply the saved theme before first paint to avoid a flash
      try {
        var th = localStorage.getItem('eft_theme');
        if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
        var lg = localStorage.getItem('eft_lang');
        if (lg) document.documentElement.lang = lg;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
