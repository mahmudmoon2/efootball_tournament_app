<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132a4a"/>
      <stop offset="0.55" stop-color="#0a1428"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#3cf29a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3cf29a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e6edf7"/>
      <stop offset="1" stop-color="#9fb0c8"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ff7b0"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <clipPath id="ballClip"><circle cx="256" cy="262" r="150"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="280" r="230" fill="url(#glow)"/>
  <!-- pitch grid -->
  <g stroke="#3cf29a" stroke-opacity="0.18" stroke-width="3">
    <path d="M40 420 L472 420 M70 470 L442 470 M110 380 L402 380"/>
    <path d="M256 360 L256 512 M170 380 L120 512 M342 380 L392 512"/>
  </g>
  <!-- ball shadow -->
  <ellipse cx="256" cy="430" rx="120" ry="18" fill="#000" opacity="0.45"/>
  <!-- glow ring -->
  <circle cx="256" cy="262" r="164" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.9"/>
  <!-- ball -->
  <circle cx="256" cy="262" r="150" fill="url(#ball)"/>
  <g clip-path="url(#ballClip)" fill="#0b1220">
    <polygon points="256,200 303,234 285,290 227,290 209,234"/>
    <polygon points="256,112 300,124 296,150 256,170 216,150 212,124"/>
    <polygon points="345,190 395,205 405,265 372,272 330,240 336,205"/>
    <polygon points="167,190 117,205 107,265 140,272 182,240 176,205"/>
    <polygon points="305,330 345,315 375,355 350,405 300,400 290,360"/>
    <polygon points="207,330 167,315 137,355 162,405 212,400 222,360"/>
  </g>
  <g clip-path="url(#ballClip)" stroke="#0b1220" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <path d="M256 200 L256 170 M303 234 L330 240 M285 290 L290 360 M227 290 L222 360 M209 234 L182 240"/>
  </g>
  <circle cx="256" cy="262" r="150" fill="none" stroke="#0b1220" stroke-opacity="0.35" stroke-width="4"/>
  <ellipse cx="205" cy="185" rx="48" ry="26" fill="#fff" opacity="0.55" transform="rotate(-30 205 185)"/>
